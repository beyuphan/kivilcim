[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kivilcim"
version = "0.0.1"  # keep in step with kivilcim/__init__.py (a test checks it)
description = "Wildfire monitoring service built on NASA FIRMS satellite data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kivilcim = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
