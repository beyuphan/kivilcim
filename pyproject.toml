[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kivilcim"
version = "0.2.2"  # keep in step with kivilcim/__init__.py (a test checks it)
description = "Wildfire monitoring service built on NASA FIRMS satellite data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Every file under static/ must be listed (a test checks it), or an installed copy would miss it.
kivilcim = ["static/*", "static/icons/*", "static/css/*", "static/js/*", "static/vendor/leaflet/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line length is a guide, not a rule
    "B008",  # FastAPI declares parameters with Query() and Depends() in the signature on purpose
    "UP017",  # datetime.timezone.utc is used throughout and works on every supported version
]
